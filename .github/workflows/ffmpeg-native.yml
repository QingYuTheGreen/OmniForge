name: 原生库构建（FFmpegKitNext）

# 为各平台编译 FFmpegKitNext 原生库，并拷贝进 third_party 插件目录，
# 供「全平台打包」流水线下载使用。也可以单独手动触发，产物即插件目录本身。
#
# 说明：这里**只编译原生库**（libav* / ffmpeg-kit-next），不使用任何 ffmpeg 命令行；
# 应用运行时同样通过平台通道直接调用原生库。

on:
  workflow_call:
    inputs:
      profile:
        description: 构建档位（仅 Apple 的 nix-*.sh 使用，如 xcode26）
        type: string
        required: false
        default: xcode26
  workflow_dispatch:
    inputs:
      profile:
        description: 构建档位（仅 Apple 的 nix-*.sh 使用，如 xcode26）
        type: string
        required: false
        default: xcode26

permissions:
  contents: read

env:
  # FFmpegKitNext 原始源码（含 android.sh / windows.sh / nix-*.sh 构建脚本）放在 native/
  NATIVE_DIR: ${{ github.workspace }}/native
  # 插件仓库内路径（third_party 内置了 FFmpegKitNext 官方 flutter 插件源码）
  PLUGIN_DIR: third_party/ffmpeg_kit_next/ffmpeg_kit_next_flutter
  PREBUILT: ${{ github.workspace }}/prebuilt
  # Linux / Windows / Android 用非 nix 脚本，没有 -p 选项：只按 LGPL 档位
  # 编「默认启用的库」（不含需要 --enable-gpl 的库），即 LGPL 构建。
  # Apple 的 nix-*.sh 需要 --profile，默认用 flake.nix 里的 xcode26。

jobs:
  # ═══════════════════════════════════════
  # Android（本地 Maven 仓库形式的 AAR）
  # ═══════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config cmake meson ninja-build nasm yasm \
            gcc g++ make git curl unzip zip wget openjdk-17-jdk

      - name: 准备 Android SDK / NDK
        run: |
          # ubuntu runner 自带 Android SDK；直接指定根目录，不去动 sdkmanager 本身
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKM="$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: 编译 FFmpegKitNext（Android，LGPL）
        working-directory: ${{ env.NATIVE_DIR }}
        run: |
          mkdir -p "$PREBUILT"
          time bash ./android.sh \
            --enable-android-zlib \
            --enable-android-media-codec

      - name: 拷贝进插件目录
        env:
          FFMPEG_KIT_PREBUILT_DIR: ${{ github.workspace }}/prebuilt
        run: bash "$PLUGIN_DIR/copy_local_binaries.sh" android

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-native-android
          path: ${{ env.PLUGIN_DIR }}/android/libs-maven
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════
  # iOS / macOS（xcframework）
  # ═══════════════════════════════════════
  apple:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖工具
        run: |
          brew install pkg-config nasm yasm meson ninja cmake autoconf automake libtool

      - name: 安装 nix（nix-*.sh 依赖 nix develop）
        # 上游 nix 安装脚本已不支持 macOS 的 --no-daemon；用 DeterminateSystems 安装器
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: 编译 FFmpegKitNext（${{ matrix.platform }}，${{ inputs.profile }}）
        working-directory: ${{ env.NATIVE_DIR }}
        run: |
          mkdir -p "$PREBUILT"
          time bash "./nix-${{ matrix.platform }}.sh" --profile "${{ inputs.profile }}"

      - name: 拷贝进插件目录
        env:
          FFMPEG_KIT_PREBUILT_DIR: ${{ github.workspace }}/prebuilt
        run: bash "$PLUGIN_DIR/copy_local_binaries.sh" ${{ matrix.platform }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-native-${{ matrix.platform }}
          path: ${{ env.PLUGIN_DIR }}/${{ matrix.platform }}/ffmpeg_kit_next_flutter/Frameworks
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════
  # Linux x64 / ARM64（本机架构，分别在不同 runner 上编）
  # ═══════════════════════════════════════
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config cmake meson ninja-build nasm yasm \
            gcc g++ make git curl unzip zip wget libjson-glib-dev

      - name: 编译 FFmpegKitNext（Linux ${{ matrix.arch }}，LGPL）
        working-directory: ${{ env.NATIVE_DIR }}
        run: |
          mkdir -p "$PREBUILT"
          time bash ./linux.sh

      - name: 拷贝进插件目录
        env:
          FFMPEG_KIT_PREBUILT_DIR: ${{ github.workspace }}/prebuilt
        run: bash "$PLUGIN_DIR/copy_local_binaries.sh" linux

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-native-linux-${{ matrix.arch }}
          path: ${{ env.PLUGIN_DIR }}/linux/Frameworks
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════
  # Windows x64 / ARM64（MSYS2 CLANG64 / CLANGARM64）
  # ═══════════════════════════════════════
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86-64
            msystem: CLANG64
            toolchain: mingw-w64-clang-x86_64-toolchain
          - runner: windows-11-arm
            arch: arm64
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel git curl unzip zip
            ${{ matrix.toolchain }}
            autoconf automake libtool pkgconf make nasm yasm cmake meson ninja
            diffutils patch python3

      - name: 编译 FFmpegKitNext（Windows ${{ matrix.arch }}，LGPL）
        working-directory: ${{ env.NATIVE_DIR }}
        run: |
          mkdir -p "$PREBUILT"
          bash ./windows.sh --arch=${{ matrix.arch }}

      - name: 拷贝进插件目录
        env:
          FFMPEG_KIT_PREBUILT_DIR: ${{ github.workspace }}/prebuilt
        run: bash "$PLUGIN_DIR/copy_local_binaries.sh" windows

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-native-windows-${{ matrix.arch }}
          path: ${{ env.PLUGIN_DIR }}/windows/Frameworks
          retention-days: 30
          if-no-files-found: error
