name: 全平台打包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  WORK_DIR: .
  # 应用名：用于产物命名，换项目只需改这一行
  APP_NAME: omniforge
  # 固定 Flutter 版本，避免上游 stable 升级导致工具链要求漂移
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ═══════════════════════════════════════
  # 1. Android: ARM64 + ARMv7 + x86_64
  # ═══════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK（按 ABI 拆分：arm64-v8a / armeabi-v7a / x86_64）
        run: flutter build apk --release --split-per-abi

      - name: 重命名产物
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" "${{ env.APP_NAME }}-$abi-release.apk"
          done
          ls -lh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/${{ env.APP_NAME }}-arm64-v8a-release.apk
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/${{ env.APP_NAME }}-armeabi-v7a-release.apk
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/${{ env.APP_NAME }}-x86_64-release.apk
          retention-days: 30

  # ═══════════════════════════════════════
  # 2. Windows x64
  # ═══════════════════════════════════════
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows x64
        run: flutter build windows --release

      - name: 打包 x64 产物
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "${{ env.APP_NAME }}-windows-x64.zip" -Force
          Get-Item "${{ env.APP_NAME }}-windows-x64.zip" | Select-Object Name, Length

      - name: 上传 x64 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.WORK_DIR }}/${{ env.APP_NAME }}-windows-x64.zip
          retention-days: 30

  # ═══════════════════════════════════════
  # 2b. Windows ARM64
  # ═══════════════════════════════════════
  windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter（官方无 Windows arm64 发行包，用源码方式）
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git C:/flutter
          echo "C:/flutter/bin" >> $GITHUB_PATH

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows ARM64
        run: flutter build windows --release

      - name: 打包 ARM64 产物
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/arm64/runner/Release/*" -DestinationPath "${{ env.APP_NAME }}-windows-arm64.zip" -Force
          Get-Item "${{ env.APP_NAME }}-windows-arm64.zip" | Select-Object Name, Length

      - name: 上传 ARM64 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: ${{ env.WORK_DIR }}/${{ env.APP_NAME }}-windows-arm64.zip
          retention-days: 30

  # ═══════════════════════════════════════
  # 3. macOS: Universal (x64 + ARM64)
  # ═══════════════════════════════════════
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 启用 macOS 桌面支持
        run: flutter config --enable-macos-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 macOS Universal（x64 + ARM64）
        run: |
          flutter build macos --release
          lipo -info build/macos/Build/Products/Release/omniforge.app/Contents/MacOS/omniforge
          lipo -archs build/macos/Build/Products/Release/omniforge.app/Contents/MacOS/omniforge | tee /tmp/archs.txt
          grep -q arm64 /tmp/archs.txt
          grep -q x86_64 /tmp/archs.txt

      - name: 打包产物（保留可执行权限）
        run: |
          cd build/macos/Build/Products/Release
          ls -la
          ditto -c -k --sequesterRsrc --keepParent omniforge.app ../../../../../${{ env.APP_NAME }}-macos-universal.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: ${{ env.WORK_DIR }}/${{ env.APP_NAME }}-macos-universal.zip
          retention-days: 30

  # ═══════════════════════════════════════
  # 4a. Linux x64
  # ═══════════════════════════════════════
  linux-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux x64
        run: flutter build linux --release

      - name: 打包产物
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-linux-x64.tar.gz" bundle

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.WORK_DIR }}/${{ env.APP_NAME }}-linux-x64.tar.gz
          retention-days: 30

  # ═══════════════════════════════════════
  # 4b. Linux ARM64
  # ═══════════════════════════════════════
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: 安装 Flutter（官方无 linux arm64 发行包，用源码方式）
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux ARM64
        run: flutter build linux --release

      - name: 打包产物
        run: |
          cd build/linux/arm64/release
          tar -czf "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-linux-arm64.tar.gz" bundle

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: ${{ env.WORK_DIR }}/${{ env.APP_NAME }}-linux-arm64.tar.gz
          retention-days: 30

  # ═══════════════════════════════════════
  # 5. iOS: ARM64（无签名）
  # ═══════════════════════════════════════
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 生成 Xcode 配置（供 CocoaPods 读取）
        run: flutter build ios --release --config-only --no-codesign

      - name: 构建 iOS（无签名 .app）
        run: flutter build ios --release --no-codesign

      - name: 打包无签名 .ipa
        run: |
          cd build/ios/iphoneos
          ls -la
          rm -rf Payload "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R Runner.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-ios-arm64-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/${{ env.APP_NAME }}-ios-arm64-unsigned.ipa"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-unsigned
          path: ${{ env.WORK_DIR }}/${{ env.APP_NAME }}-ios-arm64-unsigned.ipa
          retention-days: 30

  # ═══════════════════════════════════════
  # 6. 鸿蒙 OHOS: HAP
  # ═══════════════════════════════════════
  ohos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip curl git

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载并安装 HarmonyOS 命令行工具
        run: |
          set -e
          mkdir -p /tmp/cli-tools && cd /tmp/cli-tools
          BASE_URL="https://raw.githubusercontent.com/xiaobingtech/commandline-tools-linux-x64-26.0.0.821/refs/heads/main"
          for i in $(seq -f "%03g" 1 21); do
            FILENAME="commandline-tools-linux-x64-26.0.0.821.7z.$i"
            for attempt in 1 2 3; do
              if curl -fL --retry 3 --retry-delay 5 --max-time 600 -o "$FILENAME" "$BASE_URL/$FILENAME"; then
                break
              fi
              echo "重试 $FILENAME (第 $attempt 次)..."
              sleep 5
            done
            [ -s "$FILENAME" ] || { echo "下载失败: $FILENAME"; exit 1; }
          done
          cat commandline-tools-linux-x64-26.0.0.821.7z.* > combined.7z
          ls -lh combined.7z
          7z x combined.7z -oextract -y > /dev/null
          rm -f commandline-tools-linux-x64-26.0.0.821.7z.* combined.7z
          ZIP_FILE=$(find extract -name "*.zip" -type f | head -1)
          echo "ZIP: $ZIP_FILE"
          rm -rf /tmp/ohsdk && mkdir -p /tmp/ohsdk
          unzip -q "$ZIP_FILE" -d /tmp/ohsdk
          sudo rm -rf /opt/command-line-tools
          sudo mkdir -p /opt/command-line-tools
          if [ -d /tmp/ohsdk/command-line-tools ]; then
            sudo cp -a /tmp/ohsdk/command-line-tools/. /opt/command-line-tools/
          else
            sudo cp -a /tmp/ohsdk/. /opt/command-line-tools/
          fi
          sudo chmod -R 755 /opt/command-line-tools
          ls /opt/command-line-tools
          rm -rf /tmp/cli-tools /tmp/ohsdk

      - name: 配置 HarmonyOS 环境变量
        run: |
          echo "DEVECO_SDK_HOME=/opt/command-line-tools/sdk" >> $GITHUB_ENV
          echo "HOS_SDK_HOME=/opt/command-line-tools/sdk" >> $GITHUB_ENV
          echo "TOOL_HOME=/opt/command-line-tools" >> $GITHUB_ENV
          echo "/opt/command-line-tools/bin" >> $GITHUB_PATH
          echo "/opt/command-line-tools/hvigor/bin" >> $GITHUB_PATH
          echo "/opt/command-line-tools/ohpm/bin" >> $GITHUB_PATH
          echo "/opt/command-line-tools/sdk/default/openharmony/toolchains" >> $GITHUB_PATH
          # ohpm 镜像
          /opt/command-line-tools/bin/ohpm config set registry https://ohpm.openharmony.cn/ohpm/ || true
          # hvigor 依赖走的 npm 源
          npm config set registry https://repo.huaweicloud.com/repository/npm/

      - name: 安装 OHOS Flutter SDK
        run: |
          set -e
          git clone --depth 1 --branch oh-3.44.9-release \
            https://gitcode.com/openharmony-tpc/flutter_flutter.git /opt/flutter_ohos
          # 官方 release 分支不带 tag，flutter 会识别成 0.0.0-unknown 导致 pub 解析失败
          git -C /opt/flutter_ohos tag 3.44.9
          rm -f /opt/flutter_ohos/bin/cache/flutter.version.json
          chmod +x /opt/flutter_ohos/bin/flutter /opt/flutter_ohos/bin/dart
          echo "/opt/flutter_ohos/bin" >> $GITHUB_PATH

      - name: 验证工具链
        run: |
          which flutter ohpm hvigorw || true
          flutter --version
          ohpm --version || true
          grep -E "apiVersion|displayName" "$DEVECO_SDK_HOME/default/sdk-pkg.json"

      - name: 安装依赖
        run: flutter pub get

      - name: 编译 HAP
        run: |
          cd ohos && ohpm install && cd ..
          flutter build app --release --no-codesign

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ohos
          path: |
            ${{ env.WORK_DIR }}/ohos/entry/build/default/outputs/default/*.hap
          retention-days: 30
          if-no-files-found: error

  # ═══════════════════════════════════════
  # 7. 汇总：发 Release
  # ═══════════════════════════════════════
  release:
    needs: [android, windows-x64, windows-arm64, macos, linux-x64, linux-arm64, ios, ohos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f | head -50

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.hap
            artifacts/**/*.ipa
