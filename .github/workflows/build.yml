name: 全平台打包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: file_converter

jobs:
  # ═══════════════════════════════════════
  # 1. Android: ARM64 + x86_64 APK
  # ═══════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

  # ═══════════════════════════════════════
  # 2. Windows: x64 + ARM64
  # ═══════════════════════════════════════
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows x64
        run: flutter build windows --release

      - name: 上传 x64 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.WORK_DIR }}/build/windows/x64/runner/Release/
          retention-days: 30

  # ═══════════════════════════════════════
  # 3. macOS: Universal (x64 + ARM64)
  # ═══════════════════════════════════════
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: 启用 macOS 桌面支持
        run: flutter config --enable-macos-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 macOS Universal（x64 + ARM64）
        run: flutter build macos --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: ${{ env.WORK_DIR }}/build/macos/Build/Products/Release/
          retention-days: 30

  # ═══════════════════════════════════════
  # 4a. Linux: x64
  # ═══════════════════════════════════════
  linux-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux x64
        run: flutter build linux --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.WORK_DIR }}/build/linux/x64/release/bundle/
          retention-days: 30

  # ═══════════════════════════════════════
  # 4b. Linux: ARM64
  # ═══════════════════════════════════════
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux ARM64
        run: flutter build linux --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: ${{ env.WORK_DIR }}/build/linux/arm64/release/bundle/
          retention-days: 30

  # ═══════════════════════════════════════
  # 5. iOS: ARM64
  # ═══════════════════════════════════════
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 iOS（ARM64，无签名）
        run: flutter build ios --release --no-codesign

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: ${{ env.WORK_DIR }}/build/ios/iphoneos/
          retention-days: 30

  # ═══════════════════════════════════════
  # 6. 汇总：发 Release
  # ═══════════════════════════════════════
  release:
    needs: [android, windows, macos, linux-x64, linux-arm64, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.exe
            artifacts/**/*.app
            artifacts/**/*.ipa
