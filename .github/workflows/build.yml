name: 全平台打包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: .

jobs:
  # ═══════════════════════════════════════
  # 1. Android: ARM64 + ARMv7 + x86_64
  # ═══════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 补全平台目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=android

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK（按 ABI 拆分：arm64-v8a / armeabi-v7a / x86_64）
        run: flutter build apk --release --split-per-abi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.WORK_DIR }}/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

  # ═══════════════════════════════════════
  # 2. Windows x64
  # ═══════════════════════════════════════
  windows-x64:
    runs-on: windows-2019
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 补全平台目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=windows

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows x64
        run: flutter build windows --release

      - name: 上传 x64 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.WORK_DIR }}/build/windows/x64/runner/Release/
          retention-days: 30

  # ═══════════════════════════════════════
  # 2b. Windows ARM64
  # ═══════════════════════════════════════
  windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 补全平台目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=windows

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Windows ARM64
        run: flutter build windows --release

      - name: 上传 ARM64 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: ${{ env.WORK_DIR }}/build/windows/arm64/runner/Release/
          retention-days: 30

  # ═══════════════════════════════════════
  # 3. macOS: Universal (x64 + ARM64)
  # ═══════════════════════════════════════
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用 macOS 桌面支持
        run: flutter config --enable-macos-desktop

      - name: 补全平台目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=macos

      - name: 安装依赖
        run: flutter pub get

      - name: 安装 CocoaPods 依赖
        run: |
          cd macos
          pod install --repo-update

      - name: 构建 macOS Universal（x64 + ARM64）
        run: flutter build macos --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: ${{ env.WORK_DIR }}/build/macos/Build/Products/Release/
          retention-days: 30

  # ═══════════════════════════════════════
  # 4a. Linux x64
  # ═══════════════════════════════════════
  linux-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 补全平台目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=linux

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux x64
        run: flutter build linux --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.WORK_DIR }}/build/linux/x64/release/bundle/
          retention-days: 30

  # ═══════════════════════════════════════
  # 4b. Linux ARM64
  # ═══════════════════════════════════════
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop

      - name: 补全平台目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=linux

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux ARM64
        run: flutter build linux --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: ${{ env.WORK_DIR }}/build/linux/arm64/release/bundle/
          retention-days: 30

  # ═══════════════════════════════════════
  # 5. iOS: ARM64（无签名）
  # ═══════════════════════════════════════
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 补全 iOS 平台目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=ios

      - name: 安装依赖
        run: flutter pub get

      - name: 安装 CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update

      - name: 构建 iOS（无签名 .app）
        run: flutter build ios --release --no-codesign

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: ${{ env.WORK_DIR }}/build/ios/iphoneos/
          retention-days: 30

  # ═══════════════════════════════════════
  # 6. 鸿蒙 OHOS: CPF-Flutter 官方 SDK
  # ═══════════════════════════════════════
  ohos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: 安装 CPF-Flutter SDK
        run: |
          git clone https://gitcode.com/CPF-Flutter/flutter_flutter.git /opt/flutter_ohos
          echo "/opt/flutter_ohos/bin" >> $GITHUB_PATH
          chmod +x /opt/flutter_ohos/bin/flutter
          chmod +x /opt/flutter_ohos/bin/dart

      - name: 验证 Flutter 版本
        run: |
          which flutter
          flutter --version

      - name: 生成 ohos 工程目录
        run: |
          flutter create . --project-name omniforge --org com.omniforge.app --platforms=ohos

      - name: 编译 HAP
        run: |
          flutter build app --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ohos
          path: |
            ${{ env.WORK_DIR }}/ohos/
            ${{ env.WORK_DIR }}/build/
          retention-days: 30

  # ═══════════════════════════════════════
  # 7. 汇总：发 Release
  # ═══════════════════════════════════════
  release:
    needs: [android, windows-x64, windows-arm64, macos, linux-x64, linux-arm64, ios, ohos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f | head -50

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.exe
            artifacts/**/*.app
            artifacts/**/*.ipa
