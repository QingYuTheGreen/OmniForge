name: 一键生成 Flutter 全平台骨架

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: 验证 Flutter 版本
        run: |
          which flutter
          flutter --version
          flutter config --no-analytics

      - name: 生成各平台骨架
        run: |
          flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop
          flutter create . \
            --project-name omniforge \
            --org com.omniforge.app \
            --platforms=android,ios,web,windows,macos,linux

      - name: 生成结果
        run: |
          echo "=== 平台目录 ==="
          ls -d android ios web windows macos linux 2>/dev/null || true

      - name: 提交更改
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-generate Flutter platform folders" || echo "No changes to commit"
          git push
