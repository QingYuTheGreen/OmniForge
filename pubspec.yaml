name: omniforge
description: 全能跨平台文件转换器 - 100% 离线运行
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  yaml: ^3.1.2
  # 文件 / 目录 / 分享 / 打开：均为 pub.dev 官方包
  path_provider: ^2.1.5
  file_picker: ^8.1.2
  open_filex: ^4.7.0
  share_plus: ^10.1.1
  window_manager: ^0.3.8
  flutter_riverpod: ^2.5.1
  # 动态取色（Material You，仅 Android 12+ 生效，其他平台自动返回 null）
  dynamic_color: ^1.7.0
  # 读取安卓版本（SDK_INT），判断是否支持动态取色（仅 Android 用）
  device_info_plus: ^10.1.0
  # 公共目录写入权限申请（仅 Android 用）
  permission_handler: ^11.3.0
  # 接收其他应用分享/打开的文件（Android + iOS，钉死基线版本避免意外升级）
  receive_sharing_intent: 1.8.1
  # 运行时切换桌面图标（Android activity-alias + iOS 备选图标）
  dynamic_app_icon_changer: ^0.0.3

  # ── 转换引擎依赖（全部离线、无需联网；不调用任何命令行工具）──
  # 图片编解码：纯 Dart 实现，Android/Windows/macOS/Linux/iOS 通用
  image: ^4.5.4
  # 压缩包 / tar.gz：纯 Dart
  archive: ^4.0.10
  # XML 读写（docx / epub / gpx / xlsx 等容器格式）
  # 锁定 7.0.1：兼容当前 CI 的 Flutter/Dart 版本，API 与 7.1.0 一致
  xml: 7.0.1
  # 哈希（md5 / sha1 / sha256 / sha512）
  crypto: ^3.0.6
  # Markdown → HTML
  markdown: ^7.3.0
  # PDF 生成（图片 / 文本 → PDF）
  pdf: ^3.11.3
  # CSV 读写
  csv: ^6.0.0
  # 路径处理
  path: ^1.9.0
  # 原生音视频能力：FFmpegKitNext 官方 Flutter 插件（源码内置 third_party，
  # 原生库由 CI/本地脚本编译后拷入插件目录；不使用 ffmpeg 命令行，不依赖系统安装）
  ffmpeg_kit_next_flutter:
    path: third_party/ffmpeg_kit_next/ffmpeg_kit_next_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/formats.yaml
    - assets/icons/
