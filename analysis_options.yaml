include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # 构建产物与各平台原生工程（由 Flutter/各平台工具链生成或维护，不参与 Dart 静态检查）
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - ohos/**
    - native/**
    # 内置的 FFmpegKitNext 官方插件源码（上游代码，不按本项目 lint 规则要求）
    - third_party/**

linter:
  rules:
    avoid_print: false
    use_key_in_widget_constructors: false
