    accepts_from: [mcpack_java]
    engines: [minecraft]

  - id: mcworld_java
    name: "MC Java 版世界存档"
    category: minecraft
    extensions: [".zip"]
    accepts_from: [mcworld]
    engines: [minecraft]

  - id: mcpack_java
    name: "MC Java 版资源包"
    category: minecraft
    extensions: [".zip"]
    accepts_from: [mcpack]
    engines: [minecraft]

flows:
  - name: "video_to_gif"
    source: [mp4, mkv, mov, avi, webm]
    target: [gif]
    engine: ffmpeg
    params:
      - key: "fps"
        type: "slider"
        label: "帧率"
        default: "15"
        min: 1
        max: 60
        step: 1

  - name: "video_to_audio"
    source: [mp4, mkv, mov, avi, webm]
    target: [mp3, wav, flac, aac, m4a, ogg]
    engine: ffmpeg

  - name: "image_to_image"
    source: [jpg, png, webp, heic, bmp, tiff, ico, hdr, exr]
    target: [jpg, png, webp, bmp, tiff, ico]
    engine: image

  - name: "texture_to_image"
    source: [dds, astc, ktx, xnb, tga]
    target: [png, jpg]
    engine: texture

  - name: "ncm_to_mp3"
    source: [ncm]
    target: [mp3]
    engine: netease

  - name: "mcworld_convert"
    source: [mcworld, mcworld_java]
    target: [mcworld, mcworld_java]
    engine: minecraft
