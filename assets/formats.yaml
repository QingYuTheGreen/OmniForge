    engines: ["minecraft"]
    status: ready
    params:
      - key: "source_version"
        type: "dropdown"
        label: "源版本"
        options: ["26.3", "26.2", "26.1.2", "1.21.4", "1.20.1"]
      - key: "target_version"
        type: "dropdown"
        label: "目标版本"
        options: ["26.3", "26.2", "26.1.2", "1.21.4", "1.20.1"]
