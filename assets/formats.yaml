formats:
  # ── 1. 图像 ──
  - id: jpg
    name: "JPG 图片"
    category: image
    extensions: [".jpg", ".jpeg"]
    accepts_from: []
    engines: [image]

  - id: png
    name: "PNG 图片"
    category: image
    extensions: [".png"]
    accepts_from: []
    engines: [image]

  - id: webp
    name: "WebP 图片"
    category: image
    extensions: [".webp"]
    accepts_from: []
    engines: [image]

  - id: heic
    name: "HEIC 图片"
    category: image
    extensions: [".heic"]
    accepts_from: []
    engines: [image]

  - id: svg
    name: "SVG 矢量图"
    category: image
    extensions: [".svg"]
    accepts_from: []
    engines: [image]

  - id: gif
    name: "GIF 动图"
    category: image
    extensions: [".gif"]
    accepts_from: [video, image]
    engines: [ffmpeg]
    params:
      - key: "fps"
        type: "slider"
        label: "帧率"
        default: "15"
        min: 1
        max: 60
        step: 1
      - key: "loop"
        type: "switch"
        label: "循环播放"
        default: "true"

  - id: bmp
    name: "BMP 位图"
    category: image
    extensions: [".bmp"]
    accepts_from: []
    engines: [image]

  - id: tiff
    name: "TIFF 图片"
    category: image
    extensions: [".tiff", ".tif"]
    accepts_from: []
    engines: [image]

  - id: ico
    name: "ICO 图标"
    category: image
    extensions: [".ico"]
    accepts_from: [image]
    engines: [image]

  - id: hdr
    name: "HDR 高动态范围"
    category: image
    extensions: [".hdr"]
    accepts_from: []
    engines: [image]

  - id: exr
    name: "EXR 图像"
    category: image
    extensions: [".exr"]
    accepts_from: []
    engines: [image]

