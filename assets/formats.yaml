flows:
  - name: "video_to_gif"
    source: ["mp4", "mkv", "mov", "avi", "webm"]
    target: ["gif"]
    engine: "ffmpeg"
    params:
      - {key: "fps", type: "slider", label: "帧率", default: "12", min: 1, max: 30, step: 1}
      - {key: "start", type: "text", label: "起始时间", default: ""}
