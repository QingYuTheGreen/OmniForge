# ═══════════════════════════════════════════════════════════
# OmniForge 格式注册表
# stage: ready —— 转换引擎已接入。
# status 说明：
#   ready   —— 内置引擎可直接转换（纯 Dart，离线）
#   plugin  —— 引擎已实现但需要外部插件 / 二进制（如 ffmpeg、LibreOffice）
#   planned —— 暂未实现（会明确提示，不做假转换）
# ═══════════════════════════════════════════════════════════
stage: ready

categories:
  - key: image
    name: "图像"
    icon: "photo"
    order: 1
  - key: audio
    name: "音频"
    icon: "audiotrack"
    order: 2
  - key: video
    name: "视频"
    icon: "movie"
    order: 3
  - key: ebook
    name: "电子书"
    icon: "menu_book"
    order: 4
  - key: document
    name: "文档"
    icon: "description"
    order: 5
  - key: slides
    name: "幻灯片"
    icon: "slideshow"
    order: 6
  - key: spreadsheet
    name: "表格"
    icon: "table_chart"
    order: 7
  - key: font
    name: "字体"
    icon: "font_download"
    order: 8
  - key: palette
    name: "调色板"
    icon: "palette"
    order: 9
  - key: model3d
    name: "3D 模型"
    icon: "view_in_ar"
    order: 10
  - key: texture
    name: "纹理"
    icon: "texture"
    order: 11
  - key: mesh
    name: "网格"
    icon: "grid_on"
    order: 12
  - key: hash
    name: "哈希计算"
    icon: "tag"
    order: 13
  - key: embroidery
    name: "绣花"
    icon: "gestures"
    order: 14
  - key: gps
    name: "GPS"
    icon: "place"
    order: 15
  - key: subtitle
    name: "字幕"
    icon: "subtitles"
    order: 16
  - key: playlist
    name: "播放列表"
    icon: "queue_music"
    order: 17
  - key: archive
    name: "压缩包"
    icon: "folder_zip"
    order: 18
  - key: minecraft
    name: "我的世界专区"
    icon: "extension"
    order: 19

formats:

  # ── 1. 图像 ──
  - id: "jpg"
    name: "JPG 图片"
    categories: ["image"]
    extensions: [".jpg", ".jpeg", ".jpe", ".jfif"]
    accepts_from: ["image"]
    engines: ["image"]
    status: ready
  - id: "png"
    name: "PNG 图片"
    categories: ["image"]
    extensions: [".png", ".apng"]
    accepts_from: ["image"]
    engines: ["image"]
    status: ready
  - id: "webp"
    name: "WebP 图片"
    categories: ["image"]
    extensions: [".webp"]
    accepts_from: ["image"]
    engines: ["image"]
    status: ready
  - id: "heic"
    name: "HEIC 图片"
    categories: ["image"]
    extensions: [".heic", ".heif"]
    accepts_from: ["image"]
    engines: ["image"]
    status: planned
  - id: "svg"
    name: "SVG 矢量图"
    categories: ["image"]
    extensions: [".svg"]
    accepts_from: ["image"]
    engines: ["image"]
    status: planned
  - id: "gif"
    name: "GIF 动图"
    categories: ["image"]
    extensions: [".gif"]
    accepts_from: ["image"]
    engines: ["image"]
    status: ready
    params:
      - key: "fps"
        type: "slider"
        label: "帧率"
        default: "15"
        min: 1
        max: 60
        step: 1
      - key: "loop"
        type: "switch"
        label: "循环播放"
        default: "true"
  - id: "bmp"
    name: "BMP 位图"
    categories: ["image"]
    extensions: [".bmp", ".dib"]
    accepts_from: ["image"]
    engines: ["image"]
    status: ready
  - id: "tiff"
    name: "TIFF 图像"
    categories: ["image"]
    extensions: [".tiff", ".tif"]
    accepts_from: ["image"]
    engines: ["image"]
    status: ready
  - id: "ico"
    name: "ICO 图标"
    categories: ["image"]
    extensions: [".ico"]
    accepts_from: ["image"]
    engines: ["image"]
    status: ready
  - id: "hdr"
    name: "HDR 图像"
    categories: ["image"]
    extensions: [".hdr"]
    accepts_from: ["image"]
    engines: ["image"]
    status: planned
  - id: "exr"
