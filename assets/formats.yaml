  # ── 19. 我的世界专区 ──
  - id: mcworld
    name: "MC 基岩版世界存档"
    category: minecraft
    extensions: [".mcworld"]
    accepts_from: [mcworld_java]
    engines: [minecraft]
    params:
      - key: "source_version"
        type: "dropdown"
        label: "源版本"
        options: ["26.3", "26.2", "26.1.2", "1.21.4", "1.20.1"]
      - key: "target_version"
        type: "dropdown"
        label: "目标版本"
        options: ["26.3", "26.2", "26.1.2", "1.21.4", "1.20.1"]

  - id: mcpack
