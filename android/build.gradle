allprojects {
    repositories {
        google()
        mavenCentral()

        // FFmpegKitNext 不用远程 Maven 产物：原生库由 CI 编译后以本地 Maven
        // 仓库形式放在插件目录（third_party/.../android/libs-maven）。
        // Gradle 解析传递依赖时只用「消费方」（:app）声明过的仓库，所以这里
        // 必须把该本地仓库加到所有工程，插件自己 android/build.gradle 里的
        // exclusiveContent 只对插件内部配置生效。
        maven {
            url = uri("${rootProject.projectDir}/../third_party/ffmpeg_kit_next/ffmpeg_kit_next_flutter/android/libs-maven")
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// 插件模块（如 receive_sharing_intent）默认 Java 为 1.8、Kotlin 为 17，
// AGP 8.12 会因 JVM target 不一致直接报错，这里统一对齐到 17。
// 注意：不能用 afterEvaluate，:app 已被 evaluationDependsOn 提前求值。
subprojects { subproject ->
    if (subproject.path != ":app") {
        subproject.plugins.withId("com.android.library") {
            subproject.android.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
    subproject.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
